<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tareas - Redis</title>
    <!-- Fuentes y Estilos modernos -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 450px;
        }
        h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #2c3e50;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }
        input {
            flex: 1;
            padding: 12px 15px;
            border: 1px solid #dcdde1;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: #3498db;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #2980b9;
        }
        ul {
            list-style: none;
        }
        li {
            background: #f8f9fa;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            font-size: 16px;
            border-left: 4px solid #3498db;
            display: flex;
            align-items: center;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📋 Mis Tareas (Redis)</h1>
        
        <div class="input-group">
            <input type="text" id="taskInput" placeholder="¿Qué tenés que hacer hoy?">
            <button onclick="addTask()">Agregar</button>
        </div>

        <ul id="taskList"></ul>
    </div>

    <script>
        const API_URL = 'http://localhost:3000/api/todos';

        async function loadTasks() {
            try {
                const res = await fetch(API_URL);
                const tasks = await res.json();
                
                const list = document.getElementById('taskList');
                list.innerHTML = '';
                
                tasks.forEach(task => {
                    const li = document.createElement('li');
                    li.textContent = task.title;
                    list.appendChild(li);
                });
            } catch (error) {
                console.error('Error al cargar tareas:', error);
            }
        }

        async function addTask() {
            const input = document.getElementById('taskInput');
            const title = input.value.trim();
            
            if (!title) return;

            try {
                await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title })
                });

                input.value = '';
                loadTasks();
            } catch (error) {
                console.error('Error al guardar tarea:', error);
            }
        }

        loadTasks();
    </script>
</body>
</html>
